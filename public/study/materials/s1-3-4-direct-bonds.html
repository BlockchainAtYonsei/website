    :root {

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", Arial, sans-serif;
      line-height: 1.7;
      word-break: keep-all;
    }
    .shell { max-width: 1160px; margin: 0 auto; padding: 42px 24px 72px; }
    .hero {
      background: linear-gradient(125deg, #102b46 0%, #1a6aa8 100%);
      color: #fff;
      padding: 42px 48px;
      border-radius: 24px;
      box-shadow: 0 14px 34px #102b4626;

    .kicker { color: #b9e2ff; font-size: 12px; font-weight: 800; letter-spacing: .13em; }
    .hero h1 {
      margin: 12px 0 0;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.2;
      letter-spacing: -.05em;
    }
    .toc {
      position: sticky;
      top: 10px;
      z-index: 20;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0 24px;
      padding: 13px 16px;
      background: rgba(255,255,255,.94);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 8px 24px #102b4614;
      backdrop-filter: blur(10px);
    }
    .toc a {
      display: inline-grid;
      place-items: center;
      min-width: 38px;
      height: 32px;
      padding: 0 10px;
      border-radius: 18px;
      background: #edf5fb;
      color: #275c85;
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }
    .slide-card {
      margin: 0 0 24px;
      padding: 18px;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 28px #102b4610;
      scroll-margin-top: 84px;
    }
    .slide-card img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
    }
    .foot { margin: 23px 0 0; color: #6c7c8c; font-size: 13px; text-align: center; }
    @media (max-width: 760px) {
      .shell { padding: 18px 13px 50px; }
      .hero { padding: 27px 21px; border-radius: 16px; }
      .slide-card { padding: 8px; border-radius: 12px; }
      .toc { top: 6px; }
    }
    @media print {
      body { background: #fff; }
      .shell { max-width: none; padding: 0; }
      .hero, .toc, .foot { display: none; }
      .slide-card {
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        break-after: page;
      }
      .slide-card:last-of-type { break-after: auto; }
    }
