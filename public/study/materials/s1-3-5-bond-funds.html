      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 10px 28px #102b4610;
      scroll-margin-top: 84px;
    }
    .slide-card img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;

    .foot { margin: 23px 0 0; color: #6c7c8c; font-size: 13px; text-align: center; }
    @media (max-width: 760px) {

      body { background: #fff; }
      .shell { max-width: none; padding: 0; }
      .hero, .toc, .foot { display: none; }
      .slide-card {
        margin: 0;

        border: 0;
        border-radius: 0;
